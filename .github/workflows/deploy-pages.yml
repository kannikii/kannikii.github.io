name: Deploy To GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 헤더의 "Last updated" 날짜를 마지막 커밋 날짜(KST)로 바꿔 넣는다.
      # 저장소 파일은 그대로 두고 배포본에만 반영되므로, 커밋만 하면 날짜가 따라온다.
      - name: Stamp last-updated date
        run: |
          ISO=$(TZ=Asia/Seoul git log -1 --format=%cd --date=format-local:%Y-%m-%d)
          DOT=${ISO//-/.}
          sed -i -E "s#<time class=\"site-updated__date\" datetime=\"[0-9-]+\">[0-9.]+</time>#<time class=\"site-updated__date\" datetime=\"$ISO\">$DOT</time>#" index.html work/*.html
          grep -ho '<time class="site-updated__date"[^<]*</time>' index.html work/*.html | sort | uniq -c

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 빌드 스텝이 없는 정적 사이트다. 저장소 루트를 그대로 올린다.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
