<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 588" width="940" height="588" role="img">
<title>make — macro processor</title>
<rect x="0" y="0" width="940" height="588" fill="#161616"/>
<defs><clipPath id="tm"><rect x="0" y="0" width="940" height="588"/></clipPath></defs><g clip-path="url(#tm)"><rect x="0" y="0" width="940" height="63" fill="#242424"/><rect x="0" y="62" width="940" height="1" fill="#333333"/><rect x="28.224" y="22.68" width="17.64" height="17.64" fill="#4A4A4A"/><rect x="61.74" y="22.68" width="17.64" height="17.64" fill="#4A4A4A"/><rect x="95.256" y="22.68" width="17.64" height="17.64" fill="#4A4A4A"/><text x="153.468" y="43.74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="31.28" font-weight="400" fill="#7A7A7A" text-anchor="start" letter-spacing="0" xml:space="preserve">make — macro processor</text><text x="40.8" y="115" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="34" font-weight="400" fill="#FFFFFF" text-anchor="start" letter-spacing="0" xml:space="preserve">$ make &amp;&amp; ./macro sample.asm</text><text x="40.8" y="167" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="34" font-weight="400" fill="#7A7A7A" text-anchor="start" letter-spacing="0" xml:space="preserve">  pass 1  : 42 macros defined</text><text x="40.8" y="219" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="34" font-weight="400" fill="#7A7A7A" text-anchor="start" letter-spacing="0" xml:space="preserve">  pass 2  : 318 lines expanded</text><text x="40.8" y="271" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="34" font-weight="400" fill="#7A7A7A" text-anchor="start" letter-spacing="0" xml:space="preserve">  output  : sample.expanded.asm</text><text x="40.8" y="323" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="34" font-weight="400" fill="#BDBDBD" text-anchor="start" letter-spacing="0" xml:space="preserve"></text><text x="40.8" y="375" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="34" font-weight="400" fill="#FFFFFF" text-anchor="start" letter-spacing="0" xml:space="preserve">$ diff -q expected.asm sample.expanded.asm</text><text x="40.8" y="427" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="34" font-weight="400" fill="#FFFFFF" text-anchor="start" letter-spacing="0" xml:space="preserve">$ </text><rect x="40.8" y="451.12" width="21.08" height="31.96" fill="#FFFFFF" opacity=".75"/></g>
